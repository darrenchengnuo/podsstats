name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain version
        run: |
          xcodebuild -version
          swift --version

      - name: Build IPA (unsigned)
        working-directory: pods-stats
        run: bash build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodsStats-unsigned-ipa
          path: pods-stats/build/PodsStats.ipa
          retention-days: 14
